<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0a0a1a"/>

  <!-- Gold outer ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#c9a84c" stroke-width="1.5"/>

  <!-- Peacock feather eye shape - outer teardrop -->
  <ellipse cx="32" cy="30" rx="11" ry="15" fill="none" stroke="#c9a84c" stroke-width="1.2"/>

  <!-- Peacock feather inner oval -->
  <ellipse cx="32" cy="31" rx="6.5" ry="9" fill="#1a1a3a" stroke="#c9a84c" stroke-width="1"/>

  <!-- Diamond iris -->
  <ellipse cx="32" cy="32" rx="3.5" ry="4.5" fill="#c9a84c"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="1.5" fill="#0a0a1a"/>

  <!-- Radiating lines (feather barbs) -->
  <line x1="32" y1="16" x2="32" y2="12" stroke="#c9a84c" stroke-width="1" stroke-linecap="round"/>
  <line x1="38" y1="18" x2="41" y2="14" stroke="#c9a84c" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="26" y1="18" x2="23" y2="14" stroke="#c9a84c" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="42" y1="24" x2="46" y2="21" stroke="#c9a84c" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="22" y1="24" x2="18" y2="21" stroke="#c9a84c" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="43" y1="32" x2="48" y2="32" stroke="#c9a84c" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="21" y1="32" x2="16" y2="32" stroke="#c9a84c" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Stem -->
  <line x1="32" y1="45" x2="32" y2="52" stroke="#c9a84c" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Diamond teardrop at tip -->
  <polygon points="32,10 34.5,14 32,13 29.5,14" fill="#c9a84c"/>
</svg>
